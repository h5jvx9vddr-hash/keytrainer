name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: 0.2.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/KeyTrainer.Tests -c Release

      - name: Publish single-file exe
        run: dotnet publish src/KeyTrainer -c Release -o publish -p:Version=${{ env.VERSION }}

      - name: Self-test of the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\KeyTrainer.exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:APPDATA\KeyTrainer\logs\*.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Self-test failed with exit code $($p.ExitCode)"; exit 1 }

      # Plays the core exercises with real key presses on the runner's desktop. Informative only:
      # the runner is an English Windows Server, so German window titles may not match here.
      - name: End-to-end test (informativ)
        continue-on-error: true
        timeout-minutes: 25
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publish\KeyTrainer.exe -ArgumentList '--e2e' -Wait -PassThru
          Get-Content "$env:APPDATA\KeyTrainer\e2e\report.md" -ErrorAction SilentlyContinue
          Write-Host "E2E exit code $($p.ExitCode)"
          Copy-Item "$env:APPDATA\KeyTrainer\e2e" e2e-report -Recurse -ErrorAction SilentlyContinue

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-report
          path: e2e-report
          if-no-files-found: ignore

      - name: Defender scan
        shell: pwsh
        run: |
          $mp = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue | Select-Object -Last 1
          if (-not $mp) { $mp = Get-Item "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -ErrorAction SilentlyContinue }
          if (-not $mp) { Write-Host "MpCmdRun not found, skipping scan"; exit 0 }
          & $mp.FullName -Scan -ScanType 3 -File "$PWD\publish\KeyTrainer.exe" -DisableRemediation
          if ($LASTEXITCODE -eq 2) { Write-Error "Defender flagged KeyTrainer.exe"; exit 1 }

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish\KeyTrainer.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  KeyTrainer.exe" | Out-File -Encoding ascii -NoNewline publish\KeyTrainer.exe.sha256
          Write-Host "SHA-256: $hash"

      - uses: actions/upload-artifact@v7
        with:
          name: KeyTrainer
          path: |
            publish/KeyTrainer.exe
            publish/KeyTrainer.exe.sha256

      # Every green build on main becomes the release the in-app update button installs.
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" publish/KeyTrainer.exe publish/KeyTrainer.exe.sha256 `
            --target $env:GITHUB_SHA --title "KeyTrainer $env:VERSION" `
            --notes "Automatischer Build von $($env:GITHUB_SHA.Substring(0,7)). Update im Trainer über den Knopf Nach Updates suchen."
